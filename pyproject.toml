[project]
name = "anbv-wajo"
version = "0.1.0"
description = "A proactive email agent with calibrated autonomy and immutable safety floors"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.0.0",
    "pydantic>=2.10.0",
    "rich>=13.9.0",
    "typer>=0.15.0",
]

[project.optional-dependencies]
eval = [
    "matplotlib>=3.10.0",
    "scikit-learn>=1.7.0",
    "scipy>=1.15.0",
]
dev = [
    "hypothesis>=6.130.0",
    "pyright>=1.1.400",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.0",
]

[project.scripts]
wajo = "wajo_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wajo_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: requires an OpenAI API key"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]

